alias: Play music on the calling device
description: >-
  "play <anything>" plays via Music Assistant on the calling voice device's player.
  Player lookup: "on/in <area or player>" if said; else the Music Assistant player that
  wraps the satellite's own media player (matched by name); else a Music Assistant player
  in the satellite's area; else default_player below. Says so if none is found.
mode: parallel
triggers:
  - trigger: conversation
    command:
      - "play {query} (on|in) [the] {where}"
      - "(play|put on) [some] {query}"
      - "play [some] music"
variables:
  # Optional: set to a Music Assistant media_player entity id, e.g. media_player.kitchen_2
  default_player: ""
actions:
  - variables:
      query: "{{ trigger.slots.query | default('') }}"
      where: "{{ trigger.slots.where | default('') }}"
      player: >-
        {% set players = integration_entities('music_assistant')
             | select('match', 'media_player\.') | list %}
        {% set ns = namespace(p='') %}
        {% if where %}
          {% set a = area_id(where) %}
          {% if a %}{% set ns.p = area_entities(a) | select('in', players) | first | default('') %}{% endif %}
          {% if not ns.p %}
            {% for e in players if where | lower in (state_attr(e, 'friendly_name') or '') | lower %}
              {% if not ns.p %}{% set ns.p = e %}{% endif %}
            {% endfor %}
          {% endif %}
        {% elif trigger.device_id %}
          {# 1. the MA player wrapping this satellite's own media player (same name) #}
          {% set own = device_entities(trigger.device_id) | select('match', 'media_player\.') | list %}
          {% for o in own %}
            {% set oname = (state_attr(o, 'friendly_name') or '') | lower %}
            {% for e in players if not ns.p and oname and (state_attr(e, 'friendly_name') or '') | lower == oname %}
              {% set ns.p = e %}
            {% endfor %}
          {% endfor %}
          {# 2. any MA player in the satellite's area #}
          {% if not ns.p %}
            {% set a = area_id(trigger.device_id) %}
            {% if a %}{% set ns.p = area_entities(a) | select('in', players) | first | default('') %}{% endif %}
          {% endif %}
        {% endif %}
        {{ ns.p or default_player }}
  - if: "{{ player == '' }}"
    then:
      - set_conversation_response: >-
          I couldn't find a Music Assistant player for this device. Put the speaker's Music
          Assistant player in the same area as this voice assistant, or set a default player.
      - stop: No Music Assistant player found
  - if: "{{ query == '' }}"
    then:
      - action: media_player.media_play
        target:
          entity_id: "{{ player }}"
    else:
      - action: music_assistant.play_media
        target:
          entity_id: "{{ player }}"
        data:
          media_id: "{{ query }}"
          enqueue: replace
  - set_conversation_response: >-
      Playing {{ query or 'music' }} on {{ state_attr(player, 'friendly_name') or player }}.
