# Script: Settings > Automations & scenes > Scripts > Create > (3 dots) Edit in YAML > paste this.
# Save it with the entity id script.play_music_search (the automation calls it by that id).
#
# Finds `query` in Music Assistant, preferring your own library (where Jellyfin content lands, as
# library:// items), plays it on `player`, then checks it actually started; if not, announces the
# problem on the satellite that heard the request.
#
# 1. Library search: an item whose name is exactly the query (artist > playlist > album > track);
#    else all library tracks whose artist is exactly the query ("play teddy swims" plays your
#    Teddy Swims tracks).
# 2. Otherwise search every provider (e.g. Tidal): exact name first, then library items, then
#    artist > playlist > album > track > radio, then Music Assistant's own ranking.
alias: Play music search
mode: parallel
fields:
  player:
    description: Music Assistant media_player entity id
  query:
    description: What to play (empty = resume)
  satellite:
    description: assist_satellite entity id to announce failures on (optional)
sequence:
  - if: "{{ query == '' }}"
    then:
      - action: media_player.media_play
        target:
          entity_id: "{{ player }}"
        continue_on_error: true
    else:
      # ---- 1. your library (Jellyfin) ----
      - action: music_assistant.search
        data:
          config_entry_id: "{{ config_entry_id(player) }}"
          name: "{{ query }}"
          limit: 25
          library_only: true
        response_variable: lib
        continue_on_error: true
      - variables:
          pick: >-
            {% set r = lib if lib is mapping else {} %}
            {% set q = query | lower | trim %}
            {% set ns = namespace(best=none, tracks=[]) %}
            {% for t in ['artists', 'playlists', 'albums', 'tracks'] %}
              {% for item in (r.get(t) or []) if ns.best is none and (item.name | default('') | lower | trim) == q %}
                {% set ns.best = {'uri': item.uri | string, 'type': item.media_type | string, 'name': item.name} %}
              {% endfor %}
            {% endfor %}
            {% if ns.best is none %}
              {% for item in (r.get('tracks') or []) %}
                {% if q in (item.artists | default([]) | map(attribute='name') | map('lower') | list) %}
                  {% set ns.tracks = ns.tracks + [item.uri | string] %}
                {% endif %}
              {% endfor %}
              {% if ns.tracks %}
                {% set ns.best = {'uri': ns.tracks, 'type': 'track', 'name': query} %}
              {% endif %}
            {% endif %}
            {{ ns.best }}
      # ---- 2. everything else (streaming providers) ----
      - if: "{{ not pick }}"
        then:
          - action: music_assistant.search
            data:
              config_entry_id: "{{ config_entry_id(player) }}"
              name: "{{ query }}"
              limit: 10
            response_variable: results
            continue_on_error: true
          - variables:
              pick: >-
                {% set r = results if results is mapping else {} %}
                {% set q = query | lower | trim %}
                {% set types = ['artists', 'playlists', 'albums', 'tracks', 'radio'] %}
                {% set ns = namespace(best=none, key=999999) %}
                {% for t in types %}
                  {% for item in (r.get(t) or []) %}
                    {% set uri = item.uri | default('') | string %}
                    {% set source = 0 if uri.startswith('library://') else 1 %}
                    {% set exact = 0 if (item.name | default('') | lower | trim) == q else 1 %}
                    {% set key = exact * 10000 + source * 1000 + types.index(t) * 100 + loop.index0 %}
                    {% if key < ns.key %}
                      {% set ns.key = key %}
                      {% set ns.best = {'uri': uri, 'type': item.media_type | default('') | string, 'name': item.name | default(query)} %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.best }}
      - if: "{{ not pick }}"
        then:
          - if: "{{ satellite != '' }}"
            then:
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ satellite }}"
                data:
                  message: "Sorry, I couldn't find {{ query }} in Music Assistant."
                continue_on_error: true
          - stop: Nothing found
      - action: music_assistant.play_media
        target:
          entity_id: "{{ player }}"
        data:
          media_id: "{{ pick.uri }}"
          media_type: "{{ pick.type }}"
          enqueue: replace
        continue_on_error: true
  # Did it actually start? (play_media errors are swallowed above so we always get here)
  - wait_template: "{{ is_state(player, 'playing') }}"
    timeout: "00:00:20"
    continue_on_timeout: true
  - if: "{{ not wait.completed and satellite != '' }}"
    then:
      - action: assist_satellite.announce
        target:
          entity_id: "{{ satellite }}"
        data:
          message: >-
            Sorry, {{ query or 'the music' }} didn't start playing on
            {{ state_attr(player, 'friendly_name') or player }}.
        continue_on_error: true
