# Script: Settings > Automations & scenes > Scripts > Create > (3 dots) Edit in YAML > paste this.
# Save it with the entity id script.play_music_search (the automation calls it by that id).
#
# Plays `query` (optionally "by `artist`") on `player`, then checks it actually started; if not,
# announces the problem on the satellite that heard the request. Search order:
#   1. your Music Assistant library (where Jellyfin content lands as library:// items)
#   2. every connected provider (e.g. Tidal)
# Within a search: with an artist -> an album, else a song, with exactly that name by that artist.
# Without an artist -> exact name (artist > playlist > album > song); then a playlist whose name
# contains it ("christmas music" -> playlist "Christmas"); then all of that artist's library songs.
# If "X by Y" finds nothing, the whole phrase is searched as one name ("stand by me").
# Genres: Music Assistant's Home Assistant integration does not expose genres, so they cannot be
# matched; make a playlist named after the genre instead.
alias: Play music search
mode: parallel
fields:
  player:
    description: Music Assistant media_player entity id
  query:
    description: Artist, playlist, album or song (empty = resume)
  artist:
    description: Artist when the request was "<album or song> by <artist>" (optional)
  full:
    description: The whole phrase before splitting on "by" (optional)
  satellite:
    description: assist_satellite entity id to announce failures on (optional)
sequence:
  - variables:
      pick: ""
  - if: "{{ query == '' }}"
    then:
      - action: media_player.media_play
        target:
          entity_id: "{{ player }}"
        continue_on_error: true
    else:
      # ---- library: query by artist
      - if: "{{ not pick }}"
        then:
          - variables:
              sname: "{{ query }}"
              sartist: "{{ artist }}"
          - action: music_assistant.search
            data:
              config_entry_id: "{{ config_entry_id(player) }}"
              name: "{{ sname }}"
              artist: "{{ sartist }}"
              limit: 25
              library_only: true
            response_variable: res
            continue_on_error: true
          - variables:
              pick: >-
                {% set r = res if res is mapping else {} %}
                {% set q = sname | lower | trim %}
                {% set qn = q | regex_replace('^the ', '') | regex_replace(' (music|songs|tunes|playlist|tracks)$', '') | trim %}
                {% set a = sartist | lower | trim %}
                {% set ns = namespace(best=none, tracks=[]) %}
                {% set order = ['albums', 'tracks'] if a else ['artists', 'playlists', 'albums', 'tracks'] %}
                {% for t in order %}
                  {% for item in (r.get(t) or []) if ns.best is none %}
                    {% set nm = item.name | default('') | lower | trim %}
                    {% set names = item.artists | default([]) | map(attribute='name') | map('lower') | list %}
                    {% if (nm == q or nm == qn) and (not a or a in names) %}
                      {% set ns.best = {'uri': item.uri | string, 'type': item.media_type | string, 'name': item.name} %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {% if ns.best is none and not a and qn | length >= 4 %}
                  {% for item in (r.get('playlists') or []) if ns.best is none and qn in (item.name | default('') | lower) %}
                    {% set ns.best = {'uri': item.uri | string, 'type': 'playlist', 'name': item.name} %}
                  {% endfor %}
                {% endif %}
                {% if ns.best is none and not a %}
                  {% for item in (r.get('tracks') or []) %}
                    {% if q in (item.artists | default([]) | map(attribute='name') | map('lower') | list) %}
                      {% set ns.tracks = ns.tracks + [item.uri | string] %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.tracks %}{% set ns.best = {'uri': ns.tracks, 'type': 'track', 'name': sname} %}{% endif %}
                {% endif %}
                {{ ns.best }}
      # ---- library: (full or query) 
      - if: "{{ not pick and artist != '' }}"
        then:
          - variables:
              sname: "{{ (full or query) }}"
              sartist: "{{ '' }}"
          - action: music_assistant.search
            data:
              config_entry_id: "{{ config_entry_id(player) }}"
              name: "{{ sname }}"
              artist: "{{ sartist }}"
              limit: 25
              library_only: true
            response_variable: res
            continue_on_error: true
          - variables:
              pick: >-
                {% set r = res if res is mapping else {} %}
                {% set q = sname | lower | trim %}
                {% set qn = q | regex_replace('^the ', '') | regex_replace(' (music|songs|tunes|playlist|tracks)$', '') | trim %}
                {% set a = sartist | lower | trim %}
                {% set ns = namespace(best=none, tracks=[]) %}
                {% set order = ['albums', 'tracks'] if a else ['artists', 'playlists', 'albums', 'tracks'] %}
                {% for t in order %}
                  {% for item in (r.get(t) or []) if ns.best is none %}
                    {% set nm = item.name | default('') | lower | trim %}
                    {% set names = item.artists | default([]) | map(attribute='name') | map('lower') | list %}
                    {% if (nm == q or nm == qn) and (not a or a in names) %}
                      {% set ns.best = {'uri': item.uri | string, 'type': item.media_type | string, 'name': item.name} %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {% if ns.best is none and not a and qn | length >= 4 %}
                  {% for item in (r.get('playlists') or []) if ns.best is none and qn in (item.name | default('') | lower) %}
                    {% set ns.best = {'uri': item.uri | string, 'type': 'playlist', 'name': item.name} %}
                  {% endfor %}
                {% endif %}
                {% if ns.best is none and not a %}
                  {% for item in (r.get('tracks') or []) %}
                    {% if q in (item.artists | default([]) | map(attribute='name') | map('lower') | list) %}
                      {% set ns.tracks = ns.tracks + [item.uri | string] %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.tracks %}{% set ns.best = {'uri': ns.tracks, 'type': 'track', 'name': sname} %}{% endif %}
                {% endif %}
                {{ ns.best }}
      # ---- global: query by artist
      - if: "{{ not pick }}"
        then:
          - variables:
              sname: "{{ query }}"
              sartist: "{{ artist }}"
          - action: music_assistant.search
            data:
              config_entry_id: "{{ config_entry_id(player) }}"
              name: "{{ sname }}"
              artist: "{{ sartist }}"
              limit: 10
            response_variable: res
            continue_on_error: true
          - variables:
              pick: >-
                {% set r = res if res is mapping else {} %}
                {% set q = sname | lower | trim %}
                {% set qn = q | regex_replace('^the ', '') | regex_replace(' (music|songs|tunes|playlist|tracks)$', '') | trim %}
                {% set a = sartist | lower | trim %}
                {% set types = ['albums', 'tracks'] if a else ['artists', 'playlists', 'albums', 'tracks', 'radio'] %}
                {% set ns = namespace(best=none, key=999999) %}
                {% for t in types %}
                  {% for item in (r.get(t) or []) %}
                    {% set uri = item.uri | default('') | string %}
                    {% set nm = item.name | default('') | lower | trim %}
                    {% set names = item.artists | default([]) | map(attribute='name') | map('lower') | list %}
                    {% set source = 0 if uri.startswith('library://') else 1 %}
                    {% set exact = 0 if (nm == q or nm == qn) else 1 %}
                    {% set wrong_artist = 5000 if (a and a not in names) else 0 %}
                    {% set key = exact * 10000 + wrong_artist + source * 1000 + types.index(t) * 100 + loop.index0 %}
                    {% if key < ns.key %}
                      {% set ns.key = key %}
                      {% set ns.best = {'uri': uri, 'type': item.media_type | default('') | string, 'name': item.name | default(sname)} %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.best }}
      # ---- global: (full or query) 
      - if: "{{ not pick and artist != '' }}"
        then:
          - variables:
              sname: "{{ (full or query) }}"
              sartist: "{{ '' }}"
          - action: music_assistant.search
            data:
              config_entry_id: "{{ config_entry_id(player) }}"
              name: "{{ sname }}"
              artist: "{{ sartist }}"
              limit: 10
            response_variable: res
            continue_on_error: true
          - variables:
              pick: >-
                {% set r = res if res is mapping else {} %}
                {% set q = sname | lower | trim %}
                {% set qn = q | regex_replace('^the ', '') | regex_replace(' (music|songs|tunes|playlist|tracks)$', '') | trim %}
                {% set a = sartist | lower | trim %}
                {% set types = ['albums', 'tracks'] if a else ['artists', 'playlists', 'albums', 'tracks', 'radio'] %}
                {% set ns = namespace(best=none, key=999999) %}
                {% for t in types %}
                  {% for item in (r.get(t) or []) %}
                    {% set uri = item.uri | default('') | string %}
                    {% set nm = item.name | default('') | lower | trim %}
                    {% set names = item.artists | default([]) | map(attribute='name') | map('lower') | list %}
                    {% set source = 0 if uri.startswith('library://') else 1 %}
                    {% set exact = 0 if (nm == q or nm == qn) else 1 %}
                    {% set wrong_artist = 5000 if (a and a not in names) else 0 %}
                    {% set key = exact * 10000 + wrong_artist + source * 1000 + types.index(t) * 100 + loop.index0 %}
                    {% if key < ns.key %}
                      {% set ns.key = key %}
                      {% set ns.best = {'uri': uri, 'type': item.media_type | default('') | string, 'name': item.name | default(sname)} %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {{ ns.best }}
      - if: "{{ not pick }}"
        then:
          - if: "{{ satellite != '' }}"
            then:
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ satellite }}"
                data:
                  message: "Sorry, I couldn't find {{ query }}{{ ' by ' ~ artist if artist else '' }} in Music Assistant."
                continue_on_error: true
          - stop: Nothing found
      - action: music_assistant.play_media
        target:
          entity_id: "{{ player }}"
        data:
          media_id: "{{ pick.uri }}"
          media_type: "{{ pick.type }}"
          enqueue: replace
        continue_on_error: true
  # Did it actually start? (play_media errors are swallowed above so we always get here)
  - wait_template: "{{ is_state(player, 'playing') }}"
    timeout: "00:00:20"
    continue_on_timeout: true
  - if: "{{ not wait.completed and satellite != '' }}"
    then:
      - action: assist_satellite.announce
        target:
          entity_id: "{{ satellite }}"
        data:
          message: >-
            Sorry, {{ query or 'the music' }} didn't start playing on
            {{ state_attr(player, 'friendly_name') or player }}.
        continue_on_error: true
